<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Post 1080x1080</title><link rel="stylesheet" href="../colors/tokens.css"><link rel="stylesheet" href="../typography/typography.css">
<style>body{margin:0;background:#000}.post{width:1080px;height:1080px;background:var(--cl-void);color:var(--cl-text);position:relative;overflow:hidden;padding:90px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.post:before{content:"";position:absolute;right:-200px;top:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(var(--cl-blue),transparent 65%);opacity:.25}
.post:after{content:"";position:absolute;left:-200px;bottom:-250px;width:600px;height:600px;border-radius:50%;background:radial-gradient(var(--cl-orange),transparent 65%);opacity:.25}
.post>*{position:relative;z-index:1}.eyebrow{color:var(--cl-orange)}h1{font-size:92px;margin:24px 0}h1 em{font-style:normal;background:var(--cl-brand-gradient);-webkit-background-clip:text;color:transparent}
p{font-size:34px;color:var(--cl-text-2);max-width:760px}.foot{display:flex;justify-content:space-between;align-items:center}.foot img{height:70px}.foot span{font:500 26px var(--font-mono);color:var(--cl-text-3)}</style></head><body>
<div class="post"><div><div class="eyebrow">Case study</div><h1>Move off Oracle. <em>Keep the uptime.</em></h1><p>One-line supporting message goes here, max two lines.</p></div>
<div class="foot"><img src="../logos/primary/logo-horizontal.png" alt="CodesLytic"><span>codeslytic.com</span></div></div></body></html>
